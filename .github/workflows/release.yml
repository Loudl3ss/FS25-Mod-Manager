name: Build & Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-appimage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libgl1 libglib2.0-0 libdbus-1-3 curl

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build Linux binary
        run: pyinstaller FS25-Manager.spec --distpath dist/linux --workpath build/linux --noconfirm

      - name: Build AppImage
        run: |
          mkdir -p AppDir/usr/bin AppDir/usr/share/applications AppDir/usr/share/icons/hicolor/scalable/apps
          cp dist/linux/FS25-Manager AppDir/usr/bin/FS25-Manager
          chmod +x AppDir/usr/bin/FS25-Manager

          cat > AppDir/AppRun << 'EOF'
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "$0")")"
          exec "$HERE/usr/bin/FS25-Manager" "$@"
          EOF
          chmod +x AppDir/AppRun

          cat > AppDir/FS25-Manager.desktop << 'EOF'
          [Desktop Entry]
          Type=Application
          Name=FS25 Manager
          Exec=FS25-Manager
          Icon=fs25-manager
          Categories=Utility;
          Terminal=false
          Comment=FS25 Mod Manager desktop utility
          EOF

          cp ui/icons/agriculture_24dp_E3E3E3_FILL0_wght400_GRAD0_opsz24.svg AppDir/fs25-manager.svg
          cp ui/icons/agriculture_24dp_E3E3E3_FILL0_wght400_GRAD0_opsz24.svg AppDir/.DirIcon
          cp ui/icons/agriculture_24dp_E3E3E3_FILL0_wght400_GRAD0_opsz24.svg AppDir/usr/share/icons/hicolor/scalable/apps/fs25-manager.svg

          curl -L -o appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool
          ARCH=x86_64 ./appimagetool AppDir FS25-Manager-${{ github.ref_name }}-x86_64.AppImage

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: appimage-build
          path: FS25-Manager-${{ github.ref_name }}-x86_64.AppImage

  release:
    needs: [build-appimage]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: FS25 Manager ${{ github.ref_name }}
          body: |
            ## FS25 Manager ${{ github.ref_name }}

            ### Downloads
            - **Linux AppImage** (x86_64): `FS25-Manager-${{ github.ref_name }}-x86_64.AppImage`

            ### Installation
            ```bash
            chmod +x FS25-Manager-${{ github.ref_name }}-x86_64.AppImage
            ./FS25-Manager-${{ github.ref_name }}-x86_64.AppImage
            ```
          files: |
            artifacts/appimage-build/*.AppImage
          draft: false
          prerelease: false
