name: Build & Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libgl1 libglib2.0-0 libdbus-1-3

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build Linux binary
        run: pyinstaller FS25-Manager.spec --distpath dist/linux --workpath build/linux --noconfirm

      - name: Package Linux binary
        run: |
          cd dist/linux
          tar -czf ../../FS25-Manager-${{ github.ref_name }}-linux-x86_64.tar.gz FS25-Manager

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-build
          path: FS25-Manager-${{ github.ref_name }}-linux-x86_64.tar.gz

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build Windows binary
        run: pyinstaller FS25-Manager.spec --distpath dist/windows --workpath build/windows --noconfirm

      - name: Package Windows binary
        run: |
          cd dist/windows
          Compress-Archive -Path FS25-Manager.exe -DestinationPath ../../FS25-Manager-${{ github.ref_name }}-windows-x86_64.zip

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: FS25-Manager-${{ github.ref_name }}-windows-x86_64.zip

  release:
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: FS25 Manager ${{ github.ref_name }}
          body: |
            ## FS25 Manager ${{ github.ref_name }}

            ### Downloads
            - **Linux** (x86_64): `FS25-Manager-${{ github.ref_name }}-linux-x86_64.tar.gz`
            - **Windows** (x86_64): `FS25-Manager-${{ github.ref_name }}-windows-x86_64.zip`

            ### Installation
            **Linux:** Extract and run `./FS25-Manager`
            **Windows:** Extract and run `FS25-Manager.exe`
          files: |
            artifacts/linux-build/*.tar.gz
            artifacts/windows-build/*.zip
          draft: false
          prerelease: false
